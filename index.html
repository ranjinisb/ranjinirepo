<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjini's Calculator</title>
    <style>
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f8d7da;
    margin: 0;
}

.calculator {
    width: 500px;
    background: #268bac;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    text-align: center;
}

.display {
    width: 94%;
    height: 60px;
    text-align: right;
    font-size: 2em;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background-color: #f3f3f3;
    box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.1);
    margin-bottom: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
}

button {
    padding: 15px;
    font-size: 1.5em;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.2s ease-in-out;
    background: #7dcb1e;
    color: white;
    box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.2);
}

button:hover {
    transform: scale(1.1);
}

button:active {
    transform: scale(0.95);
}

.operator {
    background-color: #231884;
}

.operator:hover {
    background-color: #d35400;
}

.clear {
    background-color: #c0392b;
}

.clear:hover {
    background-color: #a93226;
}

.equal {
    background-color: #117038;
    grid-column: span 2;
}

.equal:hover {
    background-color: #1e8449;
}
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="buttons">
            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="appendValue('(')" >(</button>
                <button onclick="appendValue(')')" >)</button>
                <button onclick="appendValue('Math.E')">e</button>
                <button onclick="appendValue('Math.PI')">π</button>
                <button onclick="appendValue('+')" class="operator">+</button>       
                        
            
                <button onclick="appendValue('sin')"class="operator">sin</button>
                <button onclick="appendValue('cos')"class="operator">cos</button>
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button onclick="appendValue('/')" class="operator">/</button>
            
                <button onclick="appendValue('ln')"class="operator">ln</button>
                <button onclick="appendValue('log')"class="operator">log</button>
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="appendValue('*')" class="operator">*</button>
         
                <button onclick="appendValue('tan')"class="operator">tan</button>
                <button onclick="appendValue('sqrt')"class="operator">√</button>
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button onclick="appendValue('-')" class="operator">-</button>
      
                <button onclick="appendValue('!')" class="operator">x!</button>
                <button onclick="appendValue('^')" class="operator">^</button>
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button onclick="calculateResult()" class="equal">=</button>
                
            
        </div>
    </div>
    
    <script>
        function appendValue(value) {
            document.getElementById('display').value += value;
        }
        
        function clearDisplay() {
            document.getElementById('display').value = '';
        }
        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }
        
        function calculateResult() {
            try {
                let expression = document.getElementById('display').value;
                expression = expression.replace(/sin\(([^)]+)\)/g, 'Math.sin($1 * Math.PI / 180)');
                expression = expression.replace(/cos\(([^)]+)\)/g, 'Math.cos($1 * Math.PI / 180)');
                expression = expression.replace(/tan\(([^)]+)\)/g, 'Math.tan($1 * Math.PI / 180)');
                expression = expression.replace(/log\(([^)]+)\)/g, 'Math.log10($1)');
                expression = expression.replace(/ln\(([^)]+)\)/g, 'Math.log($1)');
                expression = expression.replace(/sqrt\(([^)]+)\)/g, 'Math.sqrt($1)');
                expression = expression.replace(/(\d+)\^(\d+)/g, 'Math.pow($1,$2)');
                expression = expression.replace(/(\d+)!/g, 'factorial($1)');
                
                let result = eval(expression);
                document.getElementById('display').value = result;
            } catch (e) {
                alert('Invalid Expression');
            }
        }
    </script>
</body>
</html>
